<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClaimSheet | Contents List for Your Insurance Claim</title>
<meta name="description" content="Build the contents list for your home insurance claim on your phone, room by room, with photos. Get an adjuster-ready PDF and Excel packet. Built by a former property claims adjuster.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%20aria-hidden%3D%22true%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%231f4fd1%22/%3E%3Cpath%20d%3D%22M4.2%2013.4C4.9%208.3%209.9%204.6%2016%204.6s11.1%203.7%2011.8%208.8c-1.2-.9-2.3-1.3-3.3-1.3-1.3%200-2.4.6-3.3%201.5-.9-.9-2.1-1.5-3.4-1.5h-.1c-1.3%200-2.5.6-3.4%201.5-.9-.9-2-1.5-3.3-1.5-1%200-2.1.4-3.3%201.3Z%22%20fill%3D%22%23fff%22/%3E%3Crect%20x%3D%2210.4%22%20y%3D%2215.6%22%20width%3D%2211.2%22%20height%3D%2212%22%20rx%3D%221.8%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.9%22/%3E%3Cpath%20d%3D%22M13.3%2021.6l2%202%203.6-3.8%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#1f4fd1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#f4f6fb,#0d1220);--card:light-dark(#fff,#151c30);--ink:light-dark(#141821,#eef1f8);
  --muted:light-dark(#5d6577,#9aa3b8);--line:light-dark(#dfe3ee,#27304a);
  --blue:light-dark(#1f4fd1,#5b84ff);--blue2:light-dark(#163a9c,#3f68e6);--tint:light-dark(#e8eefc,#1b2546);
  --acc:#e8432e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.08;margin:0;text-wrap:balance}
.top{background:var(--blue);color:#fff;padding:calc(16px + env(safe-area-inset-top)) max(5vw,16px) 22px}
.top .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font:800 20px Archivo,sans-serif}
.brand svg{flex:none}
.sync{font-size:13px;opacity:.9}
.total{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:18px;flex-wrap:wrap}
.total .big{font:800 clamp(34px,8vw,48px)/1 Archivo,sans-serif}
.total small{display:block;font-size:13px;opacity:.85}
.hero h1{font-size:clamp(32px,7vw,46px);margin:18px 0 10px}
.hero p{opacity:.9;max-width:560px;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:18px max(4vw,14px) 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);border-radius:12px;padding:14px;background:transparent;color:var(--ink);text-align:left;font:inherit;cursor:pointer;min-height:44px}
.mode b{display:block;font-family:Archivo,sans-serif;font-size:17px}
.mode span{font-size:13px;color:var(--muted)}
.mode.on{border-color:var(--blue);background:var(--tint)}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 5px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font:16px Inter,sans-serif;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:600 16px Inter,sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--blue2)}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.acc{background:var(--acc)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rooms{display:grid;gap:10px}
.room{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;width:100%;font:inherit;color:inherit;text-align:left;min-height:56px}
.room b{font-family:Archivo,sans-serif;font-size:17px}
.room span{color:var(--muted);font-size:14px}
.room .amt{font-weight:600;white-space:nowrap}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.thumb{width:64px;height:64px;border-radius:10px;background:var(--tint);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.nm{font-weight:600}
.meta{font-size:13px;color:var(--muted)}
.tag{display:inline-block;background:var(--acc);color:#fff;font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;margin-left:4px}
.price{text-align:right;white-space:nowrap;font-weight:600}
.price small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.link{color:var(--blue);cursor:pointer;text-decoration:underline;background:none;border:0;font:inherit;padding:0}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:0 14px;min-height:38px;font:14px Inter,sans-serif;cursor:pointer}
.back{background:none;border:0;color:var(--blue);font:600 15px Inter,sans-serif;cursor:pointer;padding:6px 0;min-height:40px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(4vw,14px) calc(10px + env(safe-area-inset-bottom))}
.dock .row{max-width:760px;margin:0 auto;justify-content:space-between}
.pay{background:var(--tint);border-radius:12px;padding:16px;margin:12px 0}
.pay .p{font:800 32px Archivo,sans-serif}
.pics{display:flex;gap:8px;flex-wrap:wrap}
.pics .ph{position:relative}
.pics .ph button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--acc);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.addpic{width:64px;height:64px;border-radius:10px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--blue);font-size:26px;cursor:pointer;background:transparent}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(4vw,16px) calc(28px + env(safe-area-inset-bottom))}
.steps{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps b.n{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-family:Archivo,sans-serif}
.linkbox{display:flex;gap:8px}
.tips h3{font:800 16px Archivo,sans-serif;margin:18px 0 6px}
.tips ul{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;line-height:1.45}
#tipsBtn{width:100%;margin-bottom:16px}
.ai{border:1.5px solid var(--blue);background:var(--tint);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.ai b{font-family:Archivo,sans-serif}
.ai .row{margin-top:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--blue);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.linkbox input{font-size:14px}
@media(max-width:600px){.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.modes{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<div class="top">
  <div class="bar">
    <a class="brand" href="/" style="color:#fff;text-decoration:none"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#fff"/><path d="M4.2 13.4C4.9 8.3 9.9 4.6 16 4.6s11.1 3.7 11.8 8.8c-1.2-.9-2.3-1.3-3.3-1.3-1.3 0-2.4.6-3.3 1.5-.9-.9-2.1-1.5-3.4-1.5h-.1c-1.3 0-2.5.6-3.4 1.5-.9-.9-2-1.5-3.3-1.5-1 0-2.1.4-3.3 1.3Z" fill="#1f4fd1"/><rect x="10.4" y="15.6" width="11.2" height="12" rx="1.8" fill="none" stroke="#1f4fd1" stroke-width="1.9"/><path d="M13.3 21.6l2 2 3.6-3.8" fill="none" stroke="#1f4fd1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>ClaimSheet</a>
    <div class="sync" id="sync"></div>
  </div>
  <div id="topbody"></div>
</div>

<div class="wrap" id="app"><div class="empty">Loading...</div></div>

<div class="dock" id="dock" hidden><div class="row">
  <button class="btn ghost" id="shareBtn">My link</button>
  <button class="btn acc" id="packetBtn">Get claim packet</button>
</div></div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const ROOM_PRESETS=['Living Room','Kitchen','Primary Bedroom','Bedroom 2','Bedroom 3','Bathroom','Garage','Laundry','Office','Dining Room','Closets','Outdoor / Patio'];
const CONDS=['Above average','Average','Below average'];
const LAST='claimready-last';
const fmt=n=>'$'+Math.round(n||0).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const $=id=>document.getElementById(id);
const app=$('app'), sheet=$('sheet');

let S=null, CID=null, PAID=false, PRICE=4900, view={screen:'home',room:null};
const photoUrl=p=>`/api/photo/${CID}/${p}`;
const itemTotal=i=>(+i.rc||0)*(+i.qty||1);
const counts=i=>S.mode==='ready'||i.damaged;
const roomTotal=r=>r.items.filter(counts).reduce((a,i)=>a+itemTotal(i),0);
const counted=()=>S.rooms.flatMap(r=>r.items.filter(counts).map(i=>({...i,room:r.name})));
const myLink=()=>`${location.origin}/app/?c=${CID}`;

/* ---------- server ---------- */
async function api(path,opts={}){
  const r=await fetch(path,opts); let d={};
  try{d=await r.json()}catch(e){}
  if(!r.ok) throw new Error(d.error||'Something went wrong. Check your connection and try again.');
  return d;
}
let saveTimer=null, saving=false, dirty=false;
function setSync(t){$('sync').textContent=t}
function save(){dirty=true;setSync('Saving...');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  if(saving||!dirty)return; saving=true; dirty=false;
  try{const d=await api(`/api/claim?c=${CID}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(S)});PRICE=d.price||PRICE;setSync(dirty?'Saving...':'Saved')}
  catch(e){dirty=true;setSync('Not saved, retrying');setTimeout(flush,4000)}
  finally{saving=false;if(dirty)flush()}
}
window.addEventListener('beforeunload',e=>{if(dirty||saving){e.preventDefault();e.returnValue=''}});

async function start(mode){
  try{
    const d=await api('/api/claim',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode,info:{},rooms:[]})});
    CID=d.id;S=d.claim;PAID=false;PRICE=d.price;
    history.replaceState(null,'',`/app/?c=${CID}`);
    try{localStorage.setItem(LAST,CID)}catch(e){}
    $('dock').hidden=false;render();setSync('Saved');
    setTimeout(()=>shareSheet(true),400);
  }catch(e){toast(e.message)}
}

async function load(){
  const q=new URLSearchParams(location.search);
  CID=q.get('c');
  if(!CID){renderWelcome();return;}
  try{
    const sid=q.get('session_id');
    if(sid){try{await api(`/api/verify?c=${CID}&session_id=${encodeURIComponent(sid)}`)}catch(e){}history.replaceState(null,'',`/app/?c=${CID}`)}
    const d=await api(`/api/claim?c=${CID}`);
    S=d.claim;PAID=d.paid;PRICE=d.price;
    try{localStorage.setItem(LAST,CID)}catch(e){}
    $('dock').hidden=false;setSync('Saved');render();
    if(sid) packet();
  }catch(e){CID=null;history.replaceState(null,'','/app/');renderWelcome(e.message)}
}

/* ---------- screens ---------- */
function header(){
  const items=counted();
  $('topbody').innerHTML=`<div class="total">
    <div><small>${S.mode==='ready'?'Home contents value (replacement cost)':'Claim total, damaged items (replacement cost)'}</small><div class="big">${fmt(items.reduce((a,i)=>a+itemTotal(i),0))}</div></div>
    <div style="text-align:right"><small>Items</small><div style="font:800 24px Archivo,sans-serif">${items.reduce((a,i)=>a+(+i.qty||1),0)}</div></div></div>`;
}

function renderWelcome(err){
  let last=null;try{last=localStorage.getItem(LAST)}catch(e){}
  $('dock').hidden=true;setSync('');
  $('topbody').innerHTML=`<div class="hero"><h1>Your contents list, done right.</h1><p>Go room by room on your phone, snap photos, and get the itemized list your insurance company asks for. Built by a former property claims adjuster.</p></div>`;
  app.innerHTML=`
  ${err?`<div class="card" style="border-color:var(--acc)">${esc(err)}</div>`:''}
  ${last?`<div class="card"><h2>Pick up where you left off</h2><p class="sub">You started a list on this device.</p><a class="btn" href="/app/?c=${esc(last)}">Continue my list</a></div>`:''}
  <div class="card">
    <h2>What do you need?</h2>
    <p class="sub">Free to build your list. You only pay when you want the finished packet.</p>
    <div class="modes">
      <button class="mode" data-start="loss"><b>I had a loss</b><span>Fire, water, storm or theft. Build the contents list for your claim.</span></button>
      <button class="mode" data-start="ready"><b>Storm ready</b><span>Document your home now, before anything happens.</span></button>
    </div>
  </div>
  <div class="card">
    <h2>How it works</h2>
    <ol class="steps">
      <li><b class="n">1</b><div><b>Walk each room.</b> Add what was damaged with a photo, brand, age and what it costs to replace today.</div></li>
      <li><b class="n">2</b><div><b>Your list saves as you go.</b> Use your private link to finish on any phone or computer.</div></li>
      <li><b class="n">3</b><div><b>Get your packet.</b> A PDF with every line item and a photo log, plus an Excel copy. One payment: $49 for a claim, $79 for 100+ items, $9 for a storm-ready inventory.</div></li>
    </ol>
  </div>
  <p class="hint" style="text-align:center">ClaimSheet helps you document and organize your belongings. It does not negotiate with your insurance company or give legal advice.</p>`;
}

function render(){
  header();
  if(view.screen==='room') return renderRoom();
  if(view.screen==='tips') return renderTips();
  app.innerHTML=`
  <div class="card">
    <h2>What are you doing?</h2>
    <p class="sub">You can switch any time. Your items stay the same.</p>
    <div class="modes">
      <button class="mode ${S.mode==='loss'?'on':''}" data-mode="loss"><b>I had a loss</b><span>Only damaged items count toward the total.</span></button>
      <button class="mode ${S.mode==='ready'?'on':''}" data-mode="ready"><b>Storm ready</b><span>Document everything now.</span></button>
    </div>
  </div>
  ${S.mode==='loss'?`<div class="card">
    <h2>Claim details</h2>
    <p class="sub">This goes at the top of your packet. Fill in what you know.</p>
    <div class="g2">
      <div><label for="f-name">Policyholder name</label><input id="f-name" data-info="name" autocomplete="name" value="${esc(S.info.name)}"></div>
      <div><label for="f-carrier">Insurance company</label><input id="f-carrier" data-info="carrier" value="${esc(S.info.carrier)}"></div>
    </div>
    <label for="f-address">Property address</label><input id="f-address" data-info="address" autocomplete="street-address" value="${esc(S.info.address)}">
    <div class="g3">
      <div><label for="f-claim">Claim number</label><input id="f-claim" data-info="claim" value="${esc(S.info.claim)}"></div>
      <div><label for="f-dol">Date of loss</label><input id="f-dol" type="date" data-info="dol" value="${esc(S.info.dol)}"></div>
      <div><label for="f-cause">Cause of loss</label><input id="f-cause" data-info="cause" placeholder="Water, fire, wind" value="${esc(S.info.cause)}"></div>
    </div>
  </div>`:`<div class="card"><h2>Your home</h2><div class="g2">
      <div><label for="f-name">Name</label><input id="f-name" data-info="name" value="${esc(S.info.name)}"></div>
      <div><label for="f-carrier">Insurance company</label><input id="f-carrier" data-info="carrier" value="${esc(S.info.carrier)}"></div></div>
    <label for="f-address">Address</label><input id="f-address" data-info="address" value="${esc(S.info.address)}"></div>`}
  <div class="card">
    <h2>Rooms</h2>
    <p class="sub">Go room by room. Tap a room to add items.</p>
    <div class="rooms">${S.rooms.length?S.rooms.map(r=>`
      <button class="room" data-room="${esc(r.id)}"><div><b>${esc(r.name)}</b><br><span>${r.items.length} item${r.items.length==1?'':'s'}${S.mode==='loss'?`, ${r.items.filter(i=>i.damaged).length} damaged`:''}</span></div><div class="amt">${fmt(roomTotal(r))} &rsaquo;</div></button>`).join(''):'<div class="empty">No rooms yet. Pick one below to get started.</div>'}
    </div>
    <label style="margin-top:16px">Add a room</label>
    <div class="chips">${ROOM_PRESETS.filter(p=>!S.rooms.some(r=>r.name===p)).map(p=>`<button class="chip" data-add="${p}">+ ${p}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><input id="customRoom" placeholder="Other room name" style="flex:1"><button class="btn sm" id="addCustom">Add</button></div>
  </div>
  <button class="room" id="tipsBtn"><div><b>Claim tips from an adjuster</b><br><span>Photos, ages, prices and what slows a claim down</span></div><div class="amt">&rsaquo;</div></button>`;
}

function renderTips(){
  app.innerHTML=`
  <button class="back" id="backBtn">&lsaquo; Back to my list</button>
  <div class="card tips">
    <h2>Claim tips from an adjuster</h2>
    <p class="sub">A clear, specific list gets approved faster and closer to full value. Here's what adjusters look for.</p>
    <h3>Photos</h3>
    <ul>
      <li><b>Take several photos of each item.</b> One of the whole item, one or two close-ups of the damage, and one of the brand tag, label or serial plate.</li>
      <li>For furniture, the tag is usually under the seat cushions or on the bottom of the frame. For electronics and appliances, check the back or inside the door.</li>
      <li>Keep damaged items until your adjuster says you can throw them out. If you have to toss something for health reasons (wet carpet, spoiled food), photograph it first.</li>
    </ul>
    <h3>Age</h3>
    <ul>
      <li><b>Enter age in years.</b> A couch bought 3 years ago is 3.</li>
      <li><b>Under a year, use months as a decimal.</b> Bought 6 months ago, enter .6. Bought 3 months ago, enter .3.</li>
      <li>Be honest and as close as you can. Age drives depreciation, and a realistic age is easier to approve than a guess that looks too low.</li>
    </ul>
    <h3>Brand and model</h3>
    <ul>
      <li>Brand and model are what turn "couch" into "Ashley 3-piece sectional." Vague items get priced at the low end.</li>
      <li>The photo scan fills these in for you. Check it, and if it says the brand is a guess, add a photo of the tag and tap Scan again.</li>
    </ul>
    <h3>Prices</h3>
    <ul>
      <li>Replacement cost is what a comparable new item costs today, not what you paid.</li>
      <li>Use the Check price online button and pick a like-kind item at a mainstream store. Save receipts, bank statements or order emails if you have them.</li>
    </ul>
    <h3>Before you send it</h3>
    <ul>
      <li>Go room by room so nothing gets missed. Closets, drawers, the garage and the pantry are the most commonly forgotten.</li>
      <li>Put your claim number on the packet and send it to your adjuster in one piece rather than a little at a time.</li>
    </ul>
  </div>`;
}

function renderRoom(){
  const r=S.rooms.find(x=>x.id===view.room);
  if(!r){view={screen:'home'};return render();}
  app.innerHTML=`
  <button class="back" id="backBtn">&lsaquo; All rooms</button>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>${esc(r.name)}</h2><div style="font-weight:600">${fmt(roomTotal(r))}</div></div>
    <div style="margin-top:8px">${r.items.length?r.items.map(i=>`
      <div class="item" data-edit="${esc(i.id)}" role="button" tabindex="0">
        ${i.photos.length?`<img class="thumb" src="${photoUrl(i.photos[0])}" alt="" loading="lazy">`:'<div class="thumb">No photo</div>'}
        <div><div class="nm">${esc(i.desc)}${S.mode==='loss'&&i.damaged?'<span class="tag">Damaged</span>':''}</div>
          <div class="meta">${esc(i.brand)}${i.brand?' &middot; ':''}Qty ${i.qty} &middot; ${i.age} yr &middot; ${esc(i.cond)}${i.photos.length>1?` &middot; ${i.photos.length} photos`:''}</div></div>
        <div class="price">${fmt(itemTotal(i))}<small>${i.qty>1?fmt(i.rc)+' each':'replacement'}</small></div>
      </div>`).join(''):'<div class="empty">No items in this room yet.</div>'}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="addItem">+ Add item</button><input id="renameRoom" value="${esc(r.name)}" aria-label="Room name" style="flex:1;max-width:220px"><button class="btn ghost sm" id="delRoom">Delete room</button></div>
  </div>`;
}

/* ---------- photos ---------- */
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const m=1280,sc=Math.min(1,m/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('Could not read that photo')),'image/jpeg',.72);};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Could not read that photo'))};
    img.src=url;
  });
}
async function uploadPhoto(file){
  const blob=await shrink(file);
  const d=await api(`/api/photo?c=${CID}`,{method:'POST',headers:{'content-type':'image/jpeg'},body:blob});
  return d.id;
}

/* ---------- item editor ---------- */
function itemForm(roomId,itemId){
  const r=S.rooms.find(x=>x.id===roomId);
  const orig=itemId?r.items.find(x=>x.id===itemId):null;
  const i=orig?{...orig,photos:[...orig.photos]}:{id:uid(),desc:'',brand:'',qty:1,age:'',cond:'Average',paid:'',rc:'',damaged:S.mode==='loss',photos:[]};
  let uploading=0;
  const pics=()=>sheet.querySelector('#pics').innerHTML=i.photos.map((p,k)=>`<div class="ph"><img class="thumb" src="${photoUrl(p)}" alt="Photo ${k+1}"><button data-rm="${k}" aria-label="Remove photo">&times;</button></div>`).join('')+(uploading?`<div class="thumb">Uploading</div>`:'')+(i.photos.length<8?`<label class="addpic" for="i-photo" title="Add photo">+</label>`:'');
  sheet.innerHTML=`
  <div class="row" style="justify-content:space-between"><h2>${itemId?'Edit item':'Add item'}</h2><button class="back" id="closeM">Close</button></div>
  <label>Photos <span class="hint">(take several: the whole item, the damage, and the brand tag or label)</span></label>
  <div class="pics" id="pics"></div>
  <input id="i-photo" type="file" accept="image/*" multiple hidden>
  <div id="ai"></div>
  <label for="i-desc">What is it?</label><input id="i-desc" value="${esc(i.desc)}" placeholder="65 inch TV, couch, microwave">
  <label for="i-brand">Brand and model</label><input id="i-brand" value="${esc(i.brand)}" placeholder="Brand, plus model if you can see it">
  <div class="g3">
    <div><label for="i-qty">Quantity</label><input id="i-qty" type="number" min="1" inputmode="numeric" value="${i.qty}"></div>
    <div><label for="i-age">Age (years)</label><input id="i-age" type="number" min="0" step="0.1" inputmode="decimal" value="${i.age}" placeholder="2 or .6"></div>
    <div><label for="i-cond">Condition before</label><select id="i-cond">${CONDS.map(c=>`<option ${c===i.cond?'selected':''}>${c}</option>`).join('')}</select></div>
  </div>
  <div class="hint">Age: under a year, use months as a decimal. Bought 6 months ago = .6</div>
  <div class="g2">
    <div><label for="i-paid">Price you paid (each)</label><input id="i-paid" type="number" min="0" inputmode="decimal" value="${i.paid}"></div>
    <div><label for="i-rc">Cost to replace today (each)</label><input id="i-rc" type="number" min="0" inputmode="decimal" value="${i.rc}"></div>
  </div>
  <div class="hint">Not sure? <button class="link" id="est">Estimate from price paid</button> (adds about 3% a year for price increases). A store lookup for the same item today is better.</div>
  ${S.mode==='loss'?`<label class="row" style="margin-top:14px"><input id="i-dmg" type="checkbox" ${i.damaged?'checked':''} style="width:22px;height:22px"> Damaged in this loss</label>`:''}
  <div class="row" style="margin-top:18px;justify-content:space-between">
    ${itemId?'<button class="btn ghost" id="delItem">Delete</button>':'<span></span>'}
    <button class="btn" id="saveItem">Save item</button>
  </div>`;
  pics();
  $('modal').classList.add('on');
  sheet.querySelector('#closeM').onclick=closeModal;
  sheet.querySelector('#est').onclick=()=>{
    const p=+sheet.querySelector('#i-paid').value,a=+sheet.querySelector('#i-age').value||0;
    if(!p){toast('Enter the price you paid first.');return;}
    sheet.querySelector('#i-rc').value=Math.round(p*Math.pow(1.03,a));
  };
  sheet.querySelector('#pics').onclick=e=>{const k=e.target.dataset.rm;if(k!==undefined){i.photos.splice(+k,1);pics();}};
  sheet.querySelector('#i-photo').onchange=async e=>{
    const files=[...e.target.files].slice(0,8-i.photos.length);e.target.value='';
    for(const f of files){uploading++;pics();
      try{const pid=await uploadPhoto(f);i.photos.push(pid);}catch(err){toast(err.message)}
      uploading--;pics();}
    if(!scanned&&i.photos.length&&!sheet.querySelector('#i-desc').value.trim())scan();
    else if(scanned&&files.length)aiBox.insertAdjacentHTML('beforeend',`<div class="hint"><button class="link" data-rescan>Scan again with all ${Math.min(4,i.photos.length)} photos</button></div>`);
    else if(!scanned)scanBtn();
  };
  let scanned=false;
  const aiBox=sheet.querySelector('#ai');
  const scanBtn=()=>{aiBox.innerHTML=i.photos.length?`<button class="link" id="scanAgain" style="margin-top:10px">Fill in details from photo</button>`:'';const b=aiBox.querySelector('#scanAgain');if(b)b.onclick=()=>scan(true);};
  aiBox.addEventListener('click',e=>{
    if(e.target.closest('[data-rescan]'))scan(true);
    const u=e.target.closest('[data-use]');if(u){sheet.querySelector('#i-brand').value=u.dataset.use;u.closest('.hint').remove();}
  });
  async function scan(force){
    if(!i.photos.length)return;
    scanned=true;
    const ids=i.photos.slice(0,4);
    aiBox.innerHTML=`<div class="ai"><span class="spin"></span>Reading your ${ids.length>1?ids.length+' photos':'photo'}...</div>`;
    try{
      const d=await api('/api/identify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({c:CID,photos:ids})});
      const set=(id,v)=>{const el=sheet.querySelector(id);if(v&&(force||!el.value.trim()||(id==='#i-qty'&&el.value==='1')))el.value=v;};
      const bm=[d.brand,d.model].filter(Boolean).join(' ');
      const bEl=sheet.querySelector('#i-brand'),had=bEl.value.trim();
      set('#i-desc',d.item);set('#i-brand',bm);
      const brandTip=had&&bm&&!force&&had.toLowerCase()!==bm.toLowerCase()
        ?`<div class="hint">You typed "${esc(had)}". The photo looks like <b>${esc(bm)}</b>. <button class="link" data-use="${esc(bm)}">Use that</button></div>`
        :d.brand_is_guess&&bm?`<div class="hint">The brand is a best guess from how it looks. Photograph the tag to confirm it.</div>`:'';
      if(d.quantity>1)set('#i-qty',d.quantity);
      set('#i-rc',d.price_typical||'');
      const q=encodeURIComponent(d.search_query||d.item);
      aiBox.innerHTML=`<div class="ai"><b>Looks like: ${esc([d.brand,d.item].filter(Boolean).join(' '))}</b>${d.confidence!=='high'?` <span class="meta">(${esc(d.confidence)} confidence)</span>`:''}
        <div>New ones typically run <b>${fmt(d.price_low)} to ${fmt(d.price_high)}</b>. We filled in ${fmt(d.price_typical)}. Check it and change anything that's off.</div>
        ${brandTip}
        ${d.note?`<div class="meta" style="margin-top:4px">${esc(d.note)}</div>`:''}
        <div class="row"><a class="btn ghost sm" href="https://www.google.com/search?tbm=shop&q=${q}" target="_blank" rel="noopener">Check price online</a><button class="link" data-rescan>Scan again</button></div></div>`;
    }catch(e){aiBox.innerHTML=`<div class="ai">${esc(e.message)}</div>`;}
  }
  scanBtn();
  sheet.querySelector('#saveItem').onclick=()=>{
    if(uploading){toast('Wait for photos to finish uploading.');return;}
    const v=id=>sheet.querySelector(id).value.trim();
    if(!v('#i-desc')){toast('Add a short description.');return;}
    Object.assign(i,{desc:v('#i-desc'),brand:v('#i-brand'),qty:Math.max(1,Math.round(+v('#i-qty'))||1),age:+v('#i-age')||0,cond:v('#i-cond'),paid:+v('#i-paid')||0,rc:+v('#i-rc')||+v('#i-paid')||0,damaged:S.mode==='loss'?sheet.querySelector('#i-dmg').checked:i.damaged});
    if(orig)Object.assign(orig,i);else r.items.push(i);
    save();closeModal();render();toast('Saved');
  };
  const del=sheet.querySelector('#delItem');
  if(del)del.onclick=()=>{if(!del.dataset.sure){del.dataset.sure=1;del.textContent='Tap again to delete';return;}r.items=r.items.filter(x=>x.id!==i.id);save();closeModal();render();toast('Item deleted');};
}

/* ---------- link + packet ---------- */
function shareSheet(first){
  sheet.innerHTML=`
  <div class="row" style="justify-content:space-between"><h2>${first?'Your list is saved':'Your private link'}</h2><button class="back" id="closeM">Close</button></div>
  <p class="sub">This link opens your list on any phone or computer. Anyone with it can see your list, so keep it private. Save it somewhere you'll find it, like a text to yourself.</p>
  <div class="linkbox"><input id="lnk" readonly value="${myLink()}"><button class="btn sm" id="cpy">Copy</button></div>
  <div class="row" style="margin-top:12px"><a class="btn ghost sm" href="sms:?&body=${encodeURIComponent('My ClaimSheet list: '+myLink())}">Text it to me</a><a class="btn ghost sm" href="mailto:?subject=${encodeURIComponent('My ClaimSheet list')}&body=${encodeURIComponent(myLink())}">Email it to me</a></div>`;
  sheet.querySelector('#closeM').onclick=closeModal;
  sheet.querySelector('#cpy').onclick=async()=>{try{await navigator.clipboard.writeText(myLink());toast('Link copied')}catch(e){sheet.querySelector('#lnk').select();toast('Press and hold to copy')}};
  $('modal').classList.add('on');
}

async function packet(){
  await flush();
  const items=counted(),total=items.reduce((a,i)=>a+itemTotal(i),0);
  const files=`<div class="row" style="margin:14px 0"><a class="btn" href="/api/export?c=${CID}&fmt=pdf">Download PDF packet</a><a class="btn ghost" href="/api/export?c=${CID}&fmt=xlsx">Download Excel</a></div>
    <p class="hint">Send both to your adjuster. If you add or change items later, just download again. Your packet stays unlocked.</p>`;
  sheet.innerHTML=`
  <div class="row" style="justify-content:space-between"><h2>${PAID?'Your packet is ready':'Your claim packet'}</h2><button class="back" id="closeM">Close</button></div>
  <p class="sub">${items.length} line items, ${fmt(total)} replacement cost, ${items.filter(i=>i.photos.length).length} with photos.</p>
  ${PAID?files:items.length?`
    <div class="pay"><div class="p">${fmt(PRICE/100)}</div>
      <div style="font-size:14px;color:var(--muted)">One time. You get an adjuster-ready PDF with every line item by room and a photo log, plus an Excel copy. Re-download any time after you add items.</div></div>
    <button class="btn acc" id="buy" style="width:100%">Pay ${fmt(PRICE/100)} and get my packet</button>
    <p class="hint" style="text-align:center">Secure checkout by Stripe.</p>`:'<div class="empty">Add at least one item first.</div>'}`;
  sheet.querySelector('#closeM').onclick=closeModal;
  const buy=sheet.querySelector('#buy');
  if(buy)buy.onclick=async()=>{
    buy.disabled=true;buy.textContent='Opening checkout...';
    try{const d=await api('/api/checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({c:CID})});
      if(d.alreadyPaid){PAID=true;packet();return;} location.href=d.url;}
    catch(e){toast(e.message);buy.disabled=false;buy.textContent='Try again';}
  };
  $('modal').classList.add('on');
}

function closeModal(){$('modal').classList.remove('on');}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000);}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-edit]'); if(!b)return;
  if(b.dataset.start){b.disabled=true;start(b.dataset.start);}
  else if(b.dataset.mode){S.mode=b.dataset.mode;save();render();}
  else if(b.dataset.room){view={screen:'room',room:b.dataset.room};render();window.scrollTo(0,0);}
  else if(b.dataset.add){S.rooms.push({id:uid(),name:b.dataset.add,items:[]});save();render();}
  else if(b.id==='addCustom'){const v=$('customRoom').value.trim();if(v){S.rooms.push({id:uid(),name:v,items:[]});save();render();}}
  else if(b.id==='backBtn'){view={screen:'home'};render();}
  else if(b.id==='tipsBtn'){view={screen:'tips'};render();window.scrollTo(0,0);}
  else if(b.id==='addItem')itemForm(view.room);
  else if(b.dataset.edit)itemForm(view.room,b.dataset.edit);
  else if(b.id==='delRoom'){const r=S.rooms.find(x=>x.id===view.room);
    if(r.items.length&&!b.dataset.sure){b.dataset.sure=1;b.textContent='Tap again to delete';return;}
    S.rooms=S.rooms.filter(x=>x.id!==view.room);save();view={screen:'home'};render();}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.edit)itemForm(view.room,e.target.dataset.edit)});
app.addEventListener('input',e=>{
  const k=e.target.dataset.info;if(k){S.info[k]=e.target.value;save();}
  if(e.target.id==='renameRoom'){const r=S.rooms.find(x=>x.id===view.room);if(r){r.name=e.target.value.slice(0,80);save();}}
});
$('packetBtn').onclick=packet;
$('shareBtn').onclick=()=>shareSheet(false);
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
load();
}
</script>
